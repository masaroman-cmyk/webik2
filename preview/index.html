<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vektor Díly – staging náhled</title><style>:root{--ink:#15191b;--muted:#697175;--paper:#f4f5f2;--line:#dde1dd;--yellow:#f4cb27;--green:#287a4d;--red:#ad3333;--max:1200px}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.5 Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.demo{padding:7px;text-align:center;background:var(--yellow);font-size:12px;font-weight:800}.bar{background:var(--ink);color:#ddd;padding:6px max(20px,calc((100vw - var(--max))/2));display:flex;justify-content:space-between;font-size:12px}.header{height:72px;padding:0 max(20px,calc((100vw - var(--max))/2));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:9}.brand{font-size:22px;font-weight:900}.brand i{font-style:normal;background:var(--yellow);font-size:11px;padding:3px 5px;margin-left:5px}.nav{display:flex;gap:28px;font-weight:700}.cart{justify-self:end;font-weight:800}.count{display:inline-grid;place-items:center;background:var(--yellow);border-radius:50%;width:25px;height:25px;margin-left:7px}.hero{height:610px;background:url('./media/hero.webp') center/cover;position:relative;color:white}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,11,12,.93),rgba(8,11,12,.62) 42%,transparent 75%)}.hero-in{position:relative;max-width:var(--max);margin:auto;padding:95px 20px}.eyebrow{color:var(--yellow);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px}.hero h1{font-size:76px;line-height:.95;margin:14px 0 24px;max-width:620px}.hero p{font-size:18px;max-width:520px;color:#eef0ef}.search{display:flex;background:white;padding:6px;max-width:590px;margin-top:26px}.search input{flex:1;border:0;padding:14px;min-width:0}.btn{border:0;background:var(--yellow);font-weight:900;padding:13px 18px;cursor:pointer;min-height:46px}.finder{max-width:var(--max);margin:-44px auto 0;position:relative;background:white;padding:26px;display:grid;grid-template-columns:240px 1fr 1fr auto;gap:14px;align-items:end;box-shadow:0 15px 38px #0002}.finder h2{margin:0;font-size:28px}.field{display:grid;gap:5px}.field span{font-size:11px;font-weight:900}.field select,.field input{border:1px solid #cbd0cc;padding:12px;background:white}.shell{max-width:var(--max);margin:auto;padding:68px 20px}.title{font-size:45px;line-height:1;margin:0 0 14px}.lead{color:var(--muted)}.tools{display:grid;grid-template-columns:1fr auto auto;gap:12px;margin:28px 0}.tools input,.tools select{border:1px solid #cbd0cc;padding:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.card{background:white}.pic{aspect-ratio:1;background:var(--paper);overflow:hidden;display:block}.pic img{width:100%;height:100%;object-fit:cover;transition:.25s}.card:hover img{transform:scale(1.025)}.body{padding:18px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:800}.body h3{font-size:18px;line-height:1.25;min-height:46px}.stock{color:var(--green);font-size:12px;font-weight:900}.out{color:var(--red)}.buy{display:flex;justify-content:space-between;align-items:center;gap:8px}.buy strong{font-size:21px}.proof{background:var(--ink);color:white;padding:30px max(20px,calc((100vw - var(--max))/2));display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.proof span{display:block;color:#adb5b2;font-size:12px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:54px}.detail img{width:100%;background:var(--paper)}.detail h1{font-size:50px;line-height:1}.price{font-size:32px;font-weight:900}.fit{background:var(--paper);border-left:4px solid var(--yellow);padding:14px;margin:24px 0}.cartline{display:grid;grid-template-columns:90px 1fr auto auto;gap:18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cartline img{width:90px}.qty{width:58px;padding:8px}.columns{display:grid;grid-template-columns:1fr 360px;gap:45px}.summary{background:var(--paper);padding:24px;height:max-content}.row{display:flex;justify-content:space-between;padding:8px 0}.total{border-top:2px solid;padding-top:16px;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form .full{grid-column:1/-1}.form input{width:100%;border:1px solid #cbd0cc;padding:12px}.choices label{display:flex;gap:12px;border:1px solid var(--line);padding:13px;margin:8px 0}.success{text-align:center;max-width:650px;margin:80px auto}.tick{width:70px;height:70px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;margin:auto;font-size:35px}.admin{background:#f0f2f0;padding:40px;min-height:560px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin:25px 0}.kpis div{background:white;padding:20px}.kpis strong{font-size:27px;display:block}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}footer{background:#0b0d0e;color:#bbc2bf;padding:42px max(20px,calc((100vw - var(--max))/2))}.empty{text-align:center;padding:70px}.notice{border-left:4px solid var(--yellow);padding:12px;background:#fffbea}@media(max-width:800px){.header{grid-template-columns:1fr auto}.nav{display:none}.hero{height:570px}.hero h1{font-size:48px}.finder{margin:0;grid-template-columns:1fr 1fr}.finder>div:first-child,.finder .btn{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}.detail,.columns{grid-template-columns:1fr}.proof{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}}@media(max-width:480px){.bar span:last-child{display:none}.hero h1{font-size:42px}.search{display:grid;background:none;gap:7px}.finder,.grid,.proof,.form,.kpis{grid-template-columns:1fr}.finder>div:first-child,.finder .btn,.form .full{grid-column:auto}.tools{grid-template-columns:1fr}.card h3{min-height:0}.cartline{grid-template-columns:70px 1fr}.cartline>:nth-child(n+3){grid-column:2}.title{font-size:38px}}</style></head><body><div class="demo">LOKÁLNÍ NÁHLED · demo data · žádné skutečné platby ani objednávky</div><div class="bar"><span>Ověření dílu podle VIN zdarma</span><span>IVECO Daily / Eurocargo · <a href="tel:+420773595509">+420773595509</a></span></div><header class="header"><a class="brand" data-go="/">VEKTOR<i>DÍLY</i></a><nav class="nav"><a data-go="/katalog">Katalog</a><a data-go="/admin">Administrace</a></nav><a class="cart" data-go="/kosik">Košík <span class="count">0</span></a></header><div id="view"></div><footer><b class="brand">VEKTOR<i>DÍLY</i></b><p>Interaktivní staging náhled českého e-shopu s náhradními díly.</p></footer><script>const P=[{"id": "brzda", "name": "Přední brzdový kotouč 300 mm", "sku": "VD-BR-3001", "price": 2190, "stock": 8, "image": "./media/brzdovy-kotouc.webp", "category": "Brzdy", "brand": "RoadForge", "oem": "5801379221", "fit": "Iveco Daily 2014–2019 35S"}, {"id": "filtr", "name": "Olejový filtr pro motor F1A", "sku": "VD-FI-1042", "price": 289, "stock": 24, "image": "./media/olejovy-filtr.webp", "category": "Filtry", "brand": "Filtronix", "oem": "2995655", "fit": "Iveco Daily 2006–2019"}];const money=n=>new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',maximumFractionDigits:0}).format(n);let cart={};try{cart=JSON.parse(localStorage.getItem('vd-local-preview-cart')||'{}')}catch{};const save=()=>{try{localStorage.setItem('vd-local-preview-cart',JSON.stringify(cart))}catch{};document.querySelectorAll('.count').forEach(e=>e.textContent=Object.values(cart).reduce((a,b)=>a+b,0))};const go=p=>{location.hash=p;render();scrollTo(0,0)};document.addEventListener('click',e=>{const n=e.target.closest('[data-go]');if(n){e.preventDefault();go(n.dataset.go)}const a=e.target.closest('[data-add]');if(a){cart[a.dataset.add]=(cart[a.dataset.add]||0)+1;save();a.textContent='Přidáno';setTimeout(()=>a.textContent='Přidat',800)}});addEventListener('hashchange',render);function card(p){return `<article class="card"><a class="pic" data-go="/produkt/${p.id}"><img src="${p.image}" alt="${p.name}"></a><div class="body"><div class="meta"><span>${p.brand}</span><span>${p.sku}</span></div><h3><a data-go="/produkt/${p.id}">${p.name}</a></h3><p class="stock ${p.stock?'':'out'}">${p.stock?'Skladem '+p.stock+' ks':'Na dotaz'}</p><div class="buy"><strong>${money(p.price)}</strong><button class="btn" data-add="${p.id}" ${p.stock?'':'disabled'}>${p.stock?'Přidat':'Vyprodáno'}</button></div></div></article>`}function catalog(){return `<main class="shell"><span class="eyebrow" style="color:#7e6b14">Vektor Díly</span><h1 class="title">Katalog náhradních dílů</h1><p class="lead">Hledejte podle názvu, SKU, OEM nebo vozidla.</p><div class="tools"><input id="q" placeholder="Název, SKU nebo OEM"><select id="cat"><option value="">Všechny kategorie</option>${[...new Set(P.map(x=>x.category))].map(x=>`<option>${x}</option>`).join('')}</select><label><input id="stock" type="checkbox"> Pouze skladem</label></div><div id="results" class="grid">${P.map(card).join('')}</div></main>`}function home(){return `<section class="hero"><div class="shade"></div><div class="hero-in"><span class="eyebrow">Náhradní díly pro IVECO</span><h1>Správný díl.<br>Bez odstávky.</h1><p>Hledejte podle OEM čísla nebo vyberte svůj vůz. Kompatibilitu před odesláním ověříme.</p><form class="search" id="heroSearch"><input placeholder="Zadejte OEM, SKU nebo název dílu"><button class="btn">Hledat v katalogu</button></form></div></section><section class="finder"><div><span class="eyebrow" style="color:#7e6b14">Vyberte vůz</span><h2>Co dnes opravujeme?</h2></div><label class="field"><span>Značka</span><select><option>Iveco</option></select></label><label class="field"><span>Model a motor</span><select><option>Daily 2014–2019 35S</option><option>Eurocargo</option></select></label><button class="btn" data-go="/katalog">Najít kompatibilní díly</button></section><section class="shell"><h2 class="title">Nejčastěji objednávané</h2><div class="grid">${P.slice(0,3).map(card).join('')}</div></section><section class="proof"><div><b>VIN kontrola</b><span>Před expedicí zdarma</span></div><div><b>14 dní</b><span>Na vrácení zboží</span></div><div><b>Česká podpora</b><span>Telefon a e-mail</span></div><div><b>Bezpečný nákup</b><span>Testovací platby</span></div></section>`}function detail(id){const p=P.find(x=>x.id===id)||P[0];return `<main class="shell"><p><a data-go="/katalog">← Zpět do katalogu</a></p><div class="detail"><img src="${p.image}" alt="${p.name}"><div><div class="meta"><span>${p.brand}</span><span>SKU ${p.sku}</span></div><h1>${p.name}</h1><p class="lead">Kvalitní náhradní díl pro spolehlivý provoz užitkového vozu.</p><div class="fit"><b>Kompatibilita</b><br>${p.fit}</div><p class="price">${money(p.price)}</p><p class="stock ${p.stock?'':'out'}">${p.stock?'Skladem '+p.stock+' ks':'Momentálně na dotaz'}</p><button class="btn" data-add="${p.id}" ${p.stock?'':'disabled'}>Přidat do košíku</button><p class="notice">OEM: ${p.oem}. Nejistý výběr? Pošlete nám VIN.</p></div></div></main>`}function cartPage(){const ls=P.filter(p=>cart[p.id]);if(!ls.length)return '<main class="shell empty"><h1 class="title">Košík je prázdný</h1><button class="btn" data-go="/katalog">Přejít do katalogu</button></main>';const sub=ls.reduce((s,p)=>s+p.price*cart[p.id],0);return `<main class="shell"><h1 class="title">Košík</h1><div class="columns"><section>${ls.map(p=>`<div class="cartline"><img src="${p.image}"><div><b>${p.name}</b><br><small>${p.sku}</small></div><input class="qty" type="number" min="1" value="${cart[p.id]}" data-qty="${p.id}"><strong>${money(p.price*cart[p.id])}</strong></div>`).join('')}</section><aside class="summary"><h2>Rekapitulace</h2><div class="row"><span>Mezisoučet</span><b>${money(sub)}</b></div><div class="row"><span>Doprava</span><b>od 89 Kč</b></div><button class="btn" style="width:100%" data-go="/pokladna">Pokračovat k pokladně</button></aside></div></main>`}function checkout(){if(!Object.keys(cart).length)return cartPage();const total=P.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0)+89;return `<main class="shell"><h1 class="title">Dokončení objednávky</h1><div class="columns"><form id="checkout"><h2>Kontaktní a doručovací údaje</h2><div class="form"><input required placeholder="Jméno"><input required placeholder="Příjmení"><input required type="email" placeholder="E-mail"><input required placeholder="Telefon"><input required class="full" placeholder="Ulice a číslo"><input required placeholder="Město"><input required placeholder="PSČ"></div><h2>Doprava</h2><div class="choices"><label><input type="radio" checked name="ship"> Zásilkovna – 89 Kč</label><label><input type="radio" name="ship"> PPL – 139 Kč</label></div><h2>Platba</h2><div class="choices"><label><input type="radio" checked name="pay"> Karta – testovací režim</label><label><input type="radio" name="pay"> Bankovní převod</label><label><input type="radio" name="pay"> Dobírka +39 Kč</label></div><label><input required type="checkbox"> Souhlasím s obchodními podmínkami</label><p><button class="btn">Objednat v testovacím režimu</button></p></form><aside class="summary"><h2>Vaše objednávka</h2><div class="row total"><span>Celkem s DPH</span><b>${money(total)}</b></div><p class="notice">Nebudou strženy žádné peníze.</p></aside></div></main>`}function admin(){return `<main class="admin"><span class="eyebrow" style="color:#7e6b14">Staging / demo data</span><h1 class="title">Provoz obchodu</h1><div class="kpis"><div>Dnešní objednávky<strong>3</strong></div><div>Tržby dnes<strong>13 977 Kč</strong></div><div>Kusů skladem<strong>58</strong></div><div>Kritický sklad<strong>2</strong></div></div><h2>Produkty a sklad</h2><table><thead><tr><th>SKU</th><th>Produkt</th><th>Sklad</th><th>Cena</th></tr></thead><tbody>${P.map(p=>`<tr><td>${p.sku}</td><td><b>${p.name}</b></td><td>${p.stock} ks</td><td>${money(p.price)}</td></tr>`).join('')}</tbody></table></main>`}function render(){const path=location.hash.slice(1)||'/';let body=path==='/katalog'?catalog():path.startsWith('/produkt/')?detail(path.split('/').pop()):path==='/kosik'?cartPage():path==='/pokladna'?checkout():path==='/admin'?admin():home();document.querySelector('#view').innerHTML=body;save();const q=document.querySelector('#q'),cat=document.querySelector('#cat'),stock=document.querySelector('#stock');const filt=()=>{const s=(q.value||'').toLowerCase();document.querySelector('#results').innerHTML=P.filter(p=>(p.name+' '+p.sku+' '+p.oem).toLowerCase().includes(s)&&(!cat.value||p.category===cat.value)&&(!stock.checked||p.stock)).map(card).join('')||'<p class="empty">Žádný výsledek.</p>'};[q,cat,stock].filter(Boolean).forEach(e=>e.addEventListener('input',filt));document.querySelector('#heroSearch')?.addEventListener('submit',e=>{e.preventDefault();go('/katalog')});document.querySelectorAll('[data-qty]').forEach(e=>e.addEventListener('change',()=>{cart[e.dataset.qty]=Math.max(1,+e.value);save();render()}));document.querySelector('#checkout')?.addEventListener('submit',e=>{e.preventDefault();cart={};save();document.querySelector('#view').innerHTML='<main class="success"><div class="tick">✓</div><h1 class="title">Objednávka přijata</h1><p>Demo objednávka VD-'+Date.now().toString().slice(-6)+' byla vytvořena. Nebyla provedena skutečná platba.</p><button class="btn" data-go="/katalog">Zpět do katalogu</button></main>'})}render();</script></body></html>
